name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PowerShell
        run: |
          curl -fsSL -o /tmp/powershell.tar.gz -L https://github.com/PowerShell/PowerShell/releases/download/v7.4.12/powershell-7.4.12-linux-x64.tar.gz
          mkdir -p "$HOME/pwsh"
          tar -xzf /tmp/powershell.tar.gz -C "$HOME/pwsh"
          chmod +x "$HOME/pwsh/pwsh"
          echo "$HOME/pwsh" >> "$GITHUB_PATH"
      - name: Install package and test dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Require all matrix jobs to pass
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more test jobs failed."
            exit 1
          fi
          echo "All Python versions passed."
